<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ZenPulse — Soothing Interval Chime PWA</title>
  <meta name="description" content="A soothing, mindful interval chime Progressive Web App that plays gentle, calming beeps every 10 seconds. Offline ready and installable.">
  <meta name="theme-color" content="#12151b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ZenPulse">
  
  <!-- Favicon and Manifest -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="sage">
  <!-- Ambient background glow elements -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>

  <main class="app-container" id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">ZenPulse</h1>
          <p class="brand-subtitle">Mindful Interval Chime</p>
        </div>
      </div>
      <div class="header-actions">
        <!-- Subtle Theme Selector -->
        <div class="theme-picker" title="Subtle Color Palette">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 3a9 9 0 0 1 9 9 9 9 0 0 1-9 9V3z" fill="currentColor"></path>
          </svg>
          <select id="themeSelect" aria-label="Color Palette">
            <option value="sage" selected>🌿 Subtle Sage</option>
            <option value="ocean">🌊 Ocean Blue</option>
            <option value="midnight">🌌 Midnight Navy</option>
            <option value="stone">🪨 Warm Stone</option>
            <option value="slate">🏔️ Nordic Slate</option>
            <option value="minimal">🍵 Zen Minimal</option>
          </select>
        </div>

        <button id="installBtn" class="btn-install hidden" title="Install ZenPulse as PWA" aria-label="Install App">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>Install</span>
        </button>
      </div>
    </header>

    <!-- Center Timer & Pulse Section -->
    <section class="timer-section" aria-label="Timer Display">
      <!-- Ripple effect container -->
      <div class="ripple-wrapper" id="rippleWrapper"></div>

      <!-- Circular Progress Dial -->
      <div class="dial-container">
        <svg class="progress-ring" viewBox="0 0 280 280">
          <circle class="ring-bg" cx="140" cy="140" r="120" />
          <circle class="ring-track" id="progressTrack" cx="140" cy="140" r="120" />
        </svg>

        <div class="dial-content">
          <span class="status-badge" id="statusBadge">Ready to start</span>
          <div class="time-display" id="timeDisplay">10.0<span class="unit">s</span></div>
          <div class="interval-note" id="intervalNote">Interval: 10s</div>
          
          <!-- Audio visualizer bars -->
          <div class="visualizer-bars" id="visualizer">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
          </div>

          <div class="breath-guide" id="breathGuide">Breathe Gently</div>
        </div>
      </div>

      <!-- Primary Action: Start/Pause -->
      <div class="primary-controls">
        <button id="toggleBtn" class="btn-primary" aria-label="Start Timer">
          <svg id="playIcon" viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <svg id="pauseIcon" class="hidden" viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
            <rect x="6" y="4" width="4" height="16"></rect>
            <rect x="14" y="4" width="4" height="16"></rect>
          </svg>
          <span id="toggleText">Start Chime</span>
        </button>

        <button id="previewBtn" class="btn-secondary" title="Preview current sound" aria-label="Test Sound">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <span>Test Sound</span>
        </button>
      </div>
    </section>

    <!-- Settings Card -->
    <section class="card settings-card" aria-label="Chime Configuration">
      <h2 class="card-title">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        Sound & Interval Options
      </h2>

      <!-- Interval Selector -->
      <div class="setting-group">
        <div class="setting-label">
          <span>Interval Duration</span>
          <span class="value-highlight" id="intervalValueLabel">10 seconds</span>
        </div>
        <div class="preset-chips">
          <button class="chip" data-seconds="5">5s</button>
          <button class="chip active" data-seconds="10">10s</button>
          <button class="chip" data-seconds="15">15s</button>
          <button class="chip" data-seconds="30">30s</button>
          <button class="chip" data-seconds="60">1m</button>
          <button class="chip" data-seconds="300">5m</button>
        </div>
        <div class="slider-row">
          <input type="range" id="intervalSlider" min="1" max="60" value="10" step="1" aria-label="Custom Interval (seconds)">
        </div>
      </div>

      <!-- Sound Preset Selector -->
      <div class="setting-group">
        <label for="soundPreset" class="setting-label">
          <span>Soothing Sound Preset</span>
          <span class="value-highlight" id="soundPresetName">Tibetan Singing Bowl</span>
        </label>
        <div class="sound-grid" id="soundPresets">
          <button class="sound-card active" data-preset="tibetan">
            <span class="sound-emoji">🧘</span>
            <span class="sound-name">Singing Bowl</span>
            <span class="sound-desc">Warm 432Hz harmonic</span>
          </button>
          <button class="sound-card" data-preset="zenchime">
            <span class="sound-emoji">🔔</span>
            <span class="sound-name">Zen Chime</span>
            <span class="sound-desc">Peaceful 528Hz bell</span>
          </button>
          <button class="sound-card" data-preset="ambient">
            <span class="sound-emoji">✨</span>
            <span class="sound-name">Soft Sine</span>
            <span class="sound-desc">Gentle pure warmth</span>
          </button>
          <button class="sound-card" data-preset="forest">
            <span class="sound-emoji">🍃</span>
            <span class="sound-name">Forest Cascade</span>
            <span class="sound-desc">Two-tone cascade</span>
          </button>
          <button class="sound-card" data-preset="deepgong">
            <span class="sound-emoji">🌊</span>
            <span class="sound-name">Deep Gong</span>
            <span class="sound-desc">Grounding 216Hz low</span>
          </button>
          <button class="sound-card" data-preset="crystalbowl">
            <span class="sound-emoji">🔮</span>
            <span class="sound-name">Crystal Bowl</span>
            <span class="sound-desc">Ethereal 852Hz crown</span>
          </button>
          <button class="sound-card" data-preset="windchime">
            <span class="sound-emoji">🎐</span>
            <span class="sound-name">Wind Chime</span>
            <span class="sound-desc">Breeze chord cascade</span>
          </button>
          <button class="sound-card" data-preset="marimba">
            <span class="sound-emoji">💧</span>
            <span class="sound-name">Raindrop</span>
            <span class="sound-desc">Warm wooden plop</span>
          </button>
          <button class="sound-card" data-preset="templewood">
            <span class="sound-emoji">🪵</span>
            <span class="sound-name">Zen Mokugyo</span>
            <span class="sound-desc">Hollow wood knock</span>
          </button>
        </div>
      </div>

      <!-- Volume Slider -->
      <div class="setting-group">
        <div class="setting-label">
          <span>Volume</span>
          <span class="value-highlight" id="volumeLabel">80%</span>
        </div>
        <div class="slider-with-icon">
          <button id="muteBtn" class="icon-toggle" aria-label="Toggle Mute">
            <svg id="volumeIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <svg id="muteIcon" class="hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="1" y1="1" x2="23" y2="23"></line>
              <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
              <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
          </button>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8" aria-label="Volume">
        </div>
      </div>

      <!-- Toggles: WakeLock & Breath Guide -->
      <div class="setting-toggles">
        <label class="toggle-control">
          <input type="checkbox" id="wakeLockToggle" checked>
          <span class="toggle-slider"></span>
          <span class="toggle-text">
            <strong>Keep Screen Awake</strong>
            <small>Prevents device sleep while running</small>
          </span>
        </label>
        
        <label class="toggle-control">
          <input type="checkbox" id="breathGuideToggle" checked>
          <span class="toggle-slider"></span>
          <span class="toggle-text">
            <strong>Breathing Guide</strong>
            <small>Visual inhale & exhale pacing cues</small>
          </span>
        </label>
      </div>
    </section>

    <!-- Session Stats -->
    <section class="card stats-card" aria-label="Session Statistics">
      <div class="stat-item">
        <span class="stat-number" id="beepCount">0</span>
        <span class="stat-label">Chimes Sounded</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-number" id="sessionDuration">00:00</span>
        <span class="stat-label">Active Time</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <button id="resetStatsBtn" class="btn-text" title="Reset Session Statistics">Reset</button>
      </div>
    </section>

    <!-- Footer -->
    <footer class="app-footer">
      <p>Works completely offline • Add to Home Screen via browser menu</p>
      <p class="shortcut-hint"><kbd>Space</kbd> to Start/Pause • <kbd>T</kbd> to Test Beep</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
